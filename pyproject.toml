[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alexa-ai-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ask-sdk-core>=1.19,<2",
  "ask-sdk-model>=1.0,<2",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
